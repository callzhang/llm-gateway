# model_info.id is pinned to what LiteLLM derived on 2026-11-27: previous_response_id names it, and
# otherwise changing any litellm_params (the api_key included) would end every stored chain.  A new
# deployment needs an id of its own (openssl rand -hex 32).
model_list:

  # ── Qwen3.6-35B-A3B heretic NVFP4 (uncensored, multimodal) ──────────────
  # Routes through model_manager :8002, which handles GPU slot management,
  # scale-out, idle unload, and x-task-id sticky routing for prefix cache
  # reuse.  Responses API → chat/completions conversion done by LiteLLM.
  # Stock qwen3.6-35b-a3b retired 2026-09-01 — heretic is the only 35B now.
  # run_qwen36_35b_heretic.sh keeps the ViT vision tower (image
  # understanding); OCR proper is served by rapidocr.
  - model_name: qwen3.6-35b-a3b-heretic
    litellm_params:
      model: custom_openai/qwen3.6-35b-a3b-heretic
      api_base: http://127.0.0.1:8002/v1
      api_key: os.environ/GATEWAY_API_KEY
      max_tokens: 32768
      timeout: 600
      stream_timeout: 600
    model_info:
      id: 6cb32b9f46f4274d37269a7c6e5258aa0f4120d036b89f80344b528d87a07b09
      # Must match --max-model-len in run_qwen36_35b_heretic.sh.  This said
      # 122880 while vLLM was actually loaded with far less, so context_fit let
      # over-length requests through and they failed at the backend.
      # max_input_tokens is the context window; LiteLLM registers it (and
      # max_output_tokens, which must equal litellm_params.max_tokens above)
      # into litellm.model_cost.  model_manager's context_fit reads these plus the
      # tokenizer and tool_cap_tokens (cap for tool arguments/results in history, default 2000).
      max_input_tokens: 81920
      max_output_tokens: 32768
      tool_cap_tokens: 2000
      tokenizer: AEON-7/Qwen3.6-35B-A3B-heretic-NVFP4
      supports_vision: true


  # ── Qwen3.8-27B NVFP4+MTP (gittensor pure-FP4 build) ────────────────────
  # Same qwen3_5 arch and same slot tuning as the retired qwen3.6-27b.
  # Vision enabled 2026-08-28: --language-model-only dropped from the run
  # script.  Cost measured at 0.98 GiB of KV (200,118 -> 177,883 tokens,
  # 3.05x -> 2.71x concurrency at 65536) once image size is capped to
  # 4 Mpx — see the measurement table in run_qwen38_27b.sh.  Images larger
  # than ~2048x2048 are downscaled by the preprocessor, not rejected.
  - model_name: qwen3.8-27b
    litellm_params:
      model: custom_openai/qwen3.8-27b
      api_base: http://127.0.0.1:8002/v1
      api_key: os.environ/GATEWAY_API_KEY
      max_tokens: 32768
      timeout: 600
      stream_timeout: 600
      # drop_params would otherwise drop reasoning_effort for custom_openai, and
      # every request ran at the template default (xhigh) whatever it asked for.
      allowed_openai_params: ["reasoning_effort"]
      # Local GPUs first.  model_manager answers 503 queue_overflow once the
      # local queue reaches OVERFLOW_QUEUE_DEPTH (gateway.env), and only then
      # does LiteLLM move on to order 2 below — see docs/region-cn.md.
      order: 1
    model_info: &qwen38_27b_info
      id: dfe5c6d1faff58fc46e3658ed6e35d8183584bac4032552170fa8b9235f1fe52
      # Must match --max-model-len in run_qwen38_27b.sh (raised 65536→131072
      # on 2026-09-02; model native is 262144).
      max_input_tokens: 131072
      max_output_tokens: 32768
      tool_cap_tokens: 2000
      tokenizer: gittensor-model-hub/Qwen3.8-27B-NVFP4-RTX5090
      tokenizer_revision: 35fd99fb8434ef70ee61372df3face5174bed2c8   # == --revision in run_qwen38_27b.sh
      supports_vision: true
      # The chat template raises on anything outside these levels (xhigh is its
      # default); reasoning_effort_hook maps OpenAI-style aliases onto them and
      # drops unknown values so they fall back to the default instead of a 400.
      reasoning_effort:
        levels: [xhigh, medium, low]
        aliases: {high: xhigh, minimal: low}

  # Overflow: the other region's model_manager (A100, China) over Tailscale,
  # same weights and revision.  Reached only after order 1 answers 503.  The
  # header tells the peer this request already crossed once, so it is queued
  # there rather than bounced back.  The peer's context_fit applies the same
  # limits (model_info is shared through the anchor).
  - model_name: qwen3.8-27b
    litellm_params:
      model: custom_openai/qwen3.8-27b
      api_base: os.environ/PEER_GATEWAY_API_BASE
      api_key: os.environ/GATEWAY_API_KEY
      max_tokens: 32768
      timeout: 600
      stream_timeout: 600
      allowed_openai_params: ["reasoning_effort"]
      extra_headers: {x-gateway-overflow: "1"}
      order: 2
    model_info: *qwen38_27b_info

  # ── Qwen3-TTS 1.7B CustomVoice (preset voices + instructions) ──────────
  # LiteLLM 1.86.2 was verified to preserve model, voice, instructions, and
  # response_format for hosted_vllm speech calls. model_manager normalizes it to
  # MP3 so LiteLLM's audio/mpeg header always matches the returned bytes.
  # No LiteLLM upgrade or VoiceDesign/Base route is required for this deployment.
  - model_name: qwen3-tts-1.7b-customvoice
    model_info:
      id: 7a9bbafabdaa3c037623dc0584f40555c597fa8c98ca5dfaa240e3dd5b358714
    litellm_params:
      model: hosted_vllm/qwen3-tts-1.7b-customvoice
      api_base: http://127.0.0.1:8002/v1
      api_key: os.environ/GATEWAY_API_KEY
      timeout: 600
      order: 1

  # Backup in the CN region.  TTS needs a whole card here (~29.3 GiB), so while
  # both slots are busy model_manager answers 503 gpu_busy and LiteLLM moves on.
  - model_name: qwen3-tts-1.7b-customvoice
    model_info:
      id: f6c237a5972eac33a0ddc9c9405afe4554fbeec21ece3114aca94515e119b414
    litellm_params:
      model: hosted_vllm/qwen3-tts-1.7b-customvoice
      api_base: os.environ/PEER_GATEWAY_API_BASE
      api_key: os.environ/GATEWAY_API_KEY
      timeout: 600
      extra_headers: {x-gateway-overflow: "1"}
      order: 2

  # ── Qwen3-ASR 0.6B: the unified speech-to-text service ─────────────────
  # `qwen3-asr` (POST /v1/audio/transcriptions).  model_manager owns the whole
  # pipeline (asr_adapter/): it cuts the upload into <=30 s chunks at quiet points,
  # skips silence, drops looping output, and sends each chunk to the FP8 GPU lane
  # (co-resident, VRAM budget, ~1 min cold start, then ~60x realtime) or — when no
  # GPU has ~3.7 GiB free — to a CPU worker process running the same model (~6x
  # realtime).  An upload of ASR_OVERFLOW_MIN_SECONDS or more that would land on
  # the CPU gets a 503 queue_overflow instead, and goes to the CN region's GPU.
  - model_name: qwen3-asr
    litellm_params:
      model: openai/qwen3-asr-0.6b
      api_base: http://127.0.0.1:8002/v1
      api_key: os.environ/GATEWAY_API_KEY
      timeout: 1800
      order: 1
    model_info:
      id: 81e5dc0ccf75ed086b67932b9af930216335c792c79d3409a57f7e6dfe44ef9c
      mode: audio_transcription

  - model_name: qwen3-asr
    litellm_params:
      model: openai/qwen3-asr-0.6b
      api_base: os.environ/PEER_GATEWAY_API_BASE
      api_key: os.environ/GATEWAY_API_KEY
      timeout: 1800
      extra_headers: {x-gateway-overflow: "1"}
      order: 2
    model_info:
      id: fa4cb72e800cfe1d0df012c56e2c7e72e5f1032090af4ce9d825060563eb76bd
      mode: audio_transcription

  # No external fallback by design — every model is served locally through
  # model_manager.  The old gpt-5.4-mini / api.kksj.org entry was removed along
  # with its OPENAI_API_KEY plumbing; the key was invalid (401) and a fallback
  # to a third party is not wanted here.

router_settings:
  routing_strategy: latency-based-routing   # probes are intercepted by model_manager: cold models → 503 (no spawn), warm models → real latency measured
  num_retries: 0          # cold-starts block in model_manager — retries don't help
  retry_after: 0
  # A queue_overflow 503 from order 1 is load shedding, not a sick backend.
  # With cooldowns on, a few of them would bench the local deployment and send
  # ALL traffic (sticky conversations included) across the border.
  disable_cooldowns: true

litellm_settings:
  drop_params: true
  set_verbose: false

  # Files are in the same directory as this config file.  Fitting requests into
  # the context window is not done here: the prompt is only complete once
  # LiteLLM has appended previous_response_id history, so model_manager (the
  # next hop) does it — see context_fit.py.
  callbacks:
    # Reject previous_response_id with no stored history instead of letting
    # LiteLLM silently run the request without it.
    - previous_response_hook.previous_response_history_hook
    # Map reasoning_effort onto what each model's chat template accepts.
    - reasoning_effort_hook.reasoning_effort_hook
    # Priority 0 at model_manager's gate is a grant held by a virtual key
    # (metadata gateway_priority), not something any client can ask for.
    - request_priority_hook.request_priority_hook
    # Keep other callers' requests out of retry breadcrumbs in the spend logs.
    - retry_breadcrumb_hook.retry_breadcrumb_hook

  # Cloudflare ends a request with 524 when the origin sends nothing for ~100 s,
  # and LiteLLM sends nothing until model_manager's first chunk, so a streaming
  # request held at the priority gate or in a long prefill used to 524.  A
  # streaming request still silent after this many seconds gets its 200 SSE
  # headers and a `: ping` comment every interval until the stream starts; gaps
  # mid-stream get the same comment.  Faster requests are byte-identical.  The
  # cost: an error found after the first ping reaches the client as a
  # `data: {"error": ...}` frame under that 200, not as an HTTP status.
  # Non-streaming requests are unaffected.  Pre-call hooks run inside this
  # wrapper, so each must answer within one interval to keep a real HTTP error
  # status (previous_response_hook waits at most 12 s).
  sse_keepalive_ping_interval_seconds: 15

general_settings:
  cancel_on_disconnect: true
  master_key: os.environ/LITELLM_MASTER_KEY
  port: 8900
  proxy_base_url: "http://stardust-gpu4:8900"
  health_check_interval: 0   # disable background probes — they hit vLLM and reset idle timer
  # Responses API previous_response_id: LiteLLM rebuilds history from
  # LiteLLM_SpendLogs.proxy_server_request/response, which stay empty unless
  # prompts are stored.  Without this, previous_response_id is a silent no-op
  # (memory-connector extraction threads ran fresh, 2026-09-20..26).
  # Rows hold raw prompt/response text, so cap retention.
  store_prompts_in_spend_logs: true
  # Spend-log rows (the previous_response_id history) are written every
  # proxy_batch_write_at + 0-5 s (default 10).  previous_response_hook can only
  # wait for a row until the first SSE keepalive, so write them sooner.
  proxy_batch_write_at: 2
  maximum_spend_logs_retention_period: "7d"
