model_list:

  # ── Qwen3.6-35B-A3B heretic NVFP4 (uncensored, multimodal) ──────────────
  # Routes through model_manager :8002, which handles GPU slot management,
  # scale-out, idle unload, and x-task-id sticky routing for prefix cache
  # reuse.  Responses API → chat/completions conversion done by LiteLLM.
  # Stock qwen3.6-35b-a3b retired 2026-09-01 — heretic is the only 35B now.
  # run_qwen36_35b_heretic.sh keeps the ViT vision tower (image
  # understanding); OCR proper is served by rapidocr.
  - model_name: qwen3.6-35b-a3b-heretic
    litellm_params:
      model: custom_openai/qwen3.6-35b-a3b-heretic
      api_base: http://127.0.0.1:8002/v1
      api_key: local-qwen36
      max_tokens: 32768
      timeout: 600
      stream_timeout: 600
    model_info:
      # Must match --max-model-len in run_qwen36_35b_heretic.sh.  This said
      # 122880 while vLLM was actually loaded with far less, so trim_hook let
      # over-length requests through and they failed at the backend.
      max_context_window_tokens: 81920
      supports_vision: true


  # ── Qwen3.8-27B NVFP4+MTP (gittensor pure-FP4 build) ────────────────────
  # Same qwen3_5 arch and same slot tuning as the retired qwen3.6-27b.
  # Vision enabled 2026-08-28: --language-model-only dropped from the run
  # script.  Cost measured at 0.98 GiB of KV (200,118 -> 177,883 tokens,
  # 3.05x -> 2.71x concurrency at 65536) once image size is capped to
  # 4 Mpx — see the measurement table in run_qwen38_27b.sh.  Images larger
  # than ~2048x2048 are downscaled by the preprocessor, not rejected.
  - model_name: qwen3.8-27b
    litellm_params:
      model: custom_openai/qwen3.8-27b
      api_base: http://127.0.0.1:8002/v1
      api_key: local-qwen36
      max_tokens: 32768
      timeout: 600
      stream_timeout: 600
    model_info:
      # Must match --max-model-len in run_qwen38_27b.sh (raised 65536→131072
      # on 2026-09-02; model native is 262144).  trim_hook reads this value.
      max_context_window_tokens: 131072
      supports_vision: true

  # ── Qwen3-TTS 1.7B CustomVoice (preset voices + instructions) ──────────
  # LiteLLM 1.86.2 was verified to preserve model, voice, instructions, and
  # response_format for hosted_vllm speech calls. model_manager normalizes it to
  # MP3 so LiteLLM's audio/mpeg header always matches the returned bytes.
  # No LiteLLM upgrade or VoiceDesign/Base route is required for this deployment.
  - model_name: qwen3-tts-1.7b-customvoice
    litellm_params:
      model: hosted_vllm/qwen3-tts-1.7b-customvoice
      api_base: http://127.0.0.1:8002/v1
      api_key: local-qwen36
      timeout: 600

  # No external fallback by design — every model is served locally through
  # model_manager.  The old gpt-5.4-mini / api.kksj.org entry was removed along
  # with its OPENAI_API_KEY plumbing; the key was invalid (401) and a fallback
  # to a third party is not wanted here.

router_settings:
  routing_strategy: latency-based-routing   # probes are intercepted by model_manager: cold models → 503 (no spawn), warm models → real latency measured
  num_retries: 0          # cold-starts block in model_manager — retries don't help
  retry_after: 0

litellm_settings:
  drop_params: true
  set_verbose: false

  # Trim over-long histories before they reach vLLM, instead of returning 400.
  # trim_hook.py is in the same directory as this config file.
  callbacks:
    - trim_hook.context_trim_hook

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  port: 8900
  proxy_base_url: "http://stardust-gpu4:8900"
  health_check_interval: 0   # disable background probes — they hit vLLM and reset idle timer
