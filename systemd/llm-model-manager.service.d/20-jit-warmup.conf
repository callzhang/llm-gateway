[Unit]
# Do not open :8002 until the FlashInfer JIT cache is warm.  A cold cache means
# the first request triggers a ~27-minute CUTLASS compile on the serving path,
# which outlives WAKE_TIMEOUT — the spawn gets killed, the cache is never
# written, and every retry starts over.  Ordering here is what "blocks new
# requests": nothing listens on 8002 while the warmup oneshot runs, so LiteLLM
# fails fast (num_retries: 0) instead of queueing behind a compile.
#
# Wants= rather than Requires= on purpose: if one model fails to warm we still
# want the models that ARE warm to serve.  With MAX_JOBS=4 in gateway.env a
# stray cold compile can no longer wedge the host, so the residual risk of
# starting anyway is a slow spawn and a 503 — not an outage.
Wants=llm-jit-warmup.service
After=llm-jit-warmup.service
